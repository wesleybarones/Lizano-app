<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#232D42" />
    <meta name="robots" content="noindex" />
    <title>Lizano · Consignado</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400&family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      /* Abertura do app: fica no HTML para aparecer antes de qualquer outra coisa */
      html, body { margin: 0; background: #232d42; }
      #splash {
        position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
        background: radial-gradient(circle at 50% 44%, #2c3854 0%, #232d42 45%, #1a2232 100%);
        transition: opacity 0.5s ease, transform 0.5s ease;
      }
      #splash.is-out { opacity: 0; transform: scale(1.04); pointer-events: none; }
      #splash .glow {
        position: absolute; width: 260px; height: 260px; border-radius: 50%; top: 50%; left: 50%; translate: -50% -62%;
        background: radial-gradient(circle, rgba(226, 201, 152, 0.28), rgba(201, 168, 105, 0.08) 45%, transparent 70%);
        opacity: 0; animation: sp-glow 1.8s ease-out 0.6s forwards;
      }
      #splash .mark { position: relative; width: 112px; height: 112px; }
      #splash .mark svg.logo { width: 100%; height: 100%; overflow: visible; }
      #splash .line { fill: none; stroke: url(#sp-gold); stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; }
      #splash .l1 { animation: sp-draw 1.05s cubic-bezier(0.65, 0, 0.35, 1) 0.2s forwards; }
      #splash .l2 { animation: sp-draw 1.05s cubic-bezier(0.65, 0, 0.35, 1) 0.5s forwards; }
      /* brilho nas linhas, como luz refletindo no metal */
      #splash .mark svg.logo { animation: sp-shine 1.1s ease-in-out 1.45s both, sp-bright 0.8s ease-in 2.55s forwards; }
      @keyframes sp-shine {
        0% { filter: drop-shadow(0 0 0 rgba(255, 236, 200, 0)); }
        45% { filter: drop-shadow(0 0 7px rgba(255, 236, 200, 0.95)) brightness(1.35); }
        100% { filter: drop-shadow(0 0 3px rgba(226, 201, 152, 0.45)); }
      }
      /* no fim, a logo brilha cada vez mais até a luz tomar a tela */
      @keyframes sp-bright {
        0% { filter: drop-shadow(0 0 3px rgba(226, 201, 152, 0.45)); }
        100% { filter: drop-shadow(0 0 22px rgba(255, 244, 222, 1)) brightness(2.2); }
      }
      #splash .flash {
        position: absolute; left: 50%; top: 50%; width: 140px; height: 140px; margin: -70px 0 0 -70px; border-radius: 50%;
        translate: 0 -42px; pointer-events: none; opacity: 0; transform: scale(0.2);
        background: radial-gradient(circle, #fffaf0 0%, #f7efdd 35%, rgba(247, 239, 221, 0.85) 55%, rgba(226, 201, 152, 0) 72%);
        animation: sp-flash 0.85s cubic-bezier(0.55, 0, 0.7, 0.4) 2.6s forwards;
      }
      @keyframes sp-flash { 0% { opacity: 0; transform: scale(0.2); } 30% { opacity: 1; } 100% { opacity: 1; transform: scale(14); } }
      /* brilho de diamante na ponta do símbolo */
      #splash .mark svg.spark { position: absolute; width: 16px; height: 16px; left: calc(50.3% - 8px); top: -6px; filter: drop-shadow(0 0 6px rgba(255, 236, 200, 0.9)); opacity: 0; transform: scale(0) rotate(-45deg); animation: sp-spark 0.9s ease-out 1.5s forwards; }
      #splash .mark svg.spark.s2 { width: 11px; height: 11px; left: calc(98% - 5.5px); top: calc(98% - 5.5px); animation-delay: 1.85s; }
      #splash .word { display: flex; flex-direction: column; align-items: center; gap: 8px; }
      #splash .name { font-family: Cinzel, Georgia, serif; font-size: 26px; letter-spacing: 0.32em; margin-right: -0.32em; color: #c9a869; display: flex; }
      #splash .name span { opacity: 0; transform: translateY(6px); animation: sp-letter 0.5s ease-out forwards; }
      #splash .tag { font-family: Cinzel, Georgia, serif; font-size: 9px; letter-spacing: 0.55em; margin-right: -0.55em; color: #e2c998; opacity: 0; animation: sp-fade 0.6s ease-out 2.15s forwards; }
      @keyframes sp-draw { to { stroke-dashoffset: 0; } }
      @keyframes sp-glow { 0% { opacity: 0; transform: scale(0.7); } 60% { opacity: 1; } 100% { opacity: 0.75; transform: scale(1); } }
            @keyframes sp-spark { 0% { opacity: 0; transform: scale(0) rotate(-45deg); } 45% { opacity: 1; transform: scale(1.15) rotate(0deg); } 100% { opacity: 0; transform: scale(0.6) rotate(30deg); } }
      @keyframes sp-letter { to { opacity: 1; transform: none; } }
      @keyframes sp-fade { to { opacity: 1; } }
      #splash.is-quick *, #splash.is-quick *::after { animation-duration: 0.01s !important; animation-delay: 0s !important; }
      #splash.is-quick .spark, #splash.is-quick .flash { display: none; }
      @media (prefers-reduced-motion: reduce) {
        #splash *, #splash *::after { animation-duration: 0.01s !important; animation-delay: 0s !important; }
        #splash .spark, #splash .flash { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="glow"></div>
      <div class="flash"></div>
      <div class="mark">
        <svg class="logo" viewBox="0 0 100 100">
          <defs>
            <linearGradient id="sp-gold" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#f3e3be" />
              <stop offset="0.5" stop-color="#c9a869" />
              <stop offset="1" stop-color="#a8864a" />
            </linearGradient>
          </defs>
          <path class="line l1" pathLength="1" d="M50.3 2 L3.2 96.8 L58 96.8" />
          <path class="line l2" pathLength="1" d="M25.1 85.2 L56.1 22.6 L98 98" />
        </svg>
        <svg class="spark" viewBox="0 0 24 24"><path d="M12 0 Q13 11 24 12 Q13 13 12 24 Q11 13 0 12 Q11 11 12 0 Z" fill="#fff6e2" /></svg>
        <svg class="spark s2" viewBox="0 0 24 24"><path d="M12 0 Q13 11 24 12 Q13 13 12 24 Q11 13 0 12 Q11 11 12 0 Z" fill="#fff6e2" /></svg>
      </div>
      <div class="word">
        <div class="name">
          <span style="animation-delay: 1.45s">L</span><span style="animation-delay: 1.54s">I</span><span style="animation-delay: 1.63s">Z</span><span style="animation-delay: 1.72s">A</span><span style="animation-delay: 1.81s">N</span><span style="animation-delay: 1.9s">O</span>
        </div>
        <div class="tag">SEMIJOIAS</div>
      </div>
    </div>
    <script>
      // Abertura completa na 1ª vez da sessão; se reabrir logo em seguida, abreviada.
      (function () {
        var quick = false;
        try { quick = sessionStorage.getItem('lz-splash') === '1'; sessionStorage.setItem('lz-splash', '1'); } catch (e) {}
        var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
        window.__splashMin = Date.now() + (quick || reduce ? 350 : 3400);
        if (quick) document.getElementById('splash').classList.add('is-quick');
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
