<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#232D42" />
    <meta name="robots" content="noindex" />
    <title>Lizano · Consignado</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400&family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      /* Abertura do app: fica no HTML para aparecer antes de qualquer outra coisa */
      html, body { margin: 0; background: #232d42; }
      #splash {
        position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
        background: radial-gradient(circle at 50% 44%, #2c3854 0%, #232d42 45%, #1a2232 100%);
        transition: opacity 0.6s ease, transform 0.6s ease;
      }
      #splash .sky { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0; transition: opacity 0.9s ease; }
      #splash .sky.is-on { opacity: 1; }
      #splash.is-out { opacity: 0; transform: scale(1.04); pointer-events: none; }
      #splash .glow {
        position: absolute; width: 260px; height: 260px; border-radius: 50%; top: 50%; left: 50%; translate: -50% -62%;
        background: radial-gradient(circle, rgba(226, 201, 152, 0.28), rgba(201, 168, 105, 0.08) 45%, transparent 70%);
        opacity: 0; animation: sp-glow 1.8s ease-out 0.6s forwards;
      }
      #splash .mark { position: relative; width: 112px; height: 112px; }
      #splash .mark svg.logo { width: 100%; height: 100%; overflow: visible; }
      #splash .line { fill: none; stroke: url(#sp-gold); stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; }
      #splash .l1 { animation: sp-draw 1.05s cubic-bezier(0.65, 0, 0.35, 1) 0.2s forwards; }
      #splash .l2 { animation: sp-draw 1.05s cubic-bezier(0.65, 0, 0.35, 1) 0.5s forwards; }
      /* brilho nas linhas, como luz refletindo no metal */
      #splash .mark svg.logo { animation: sp-shine 1.1s ease-in-out 1.45s both; }
      /* quando a estrela cadente encontra a logo: a logo acende e a luz toma a tela */
      #splash.is-hit .mark svg.logo { animation: sp-shine 1.1s ease-in-out 1.45s both, sp-bright 1.1s cubic-bezier(0.5, 0, 0.85, 0.35) 0s forwards; }
      @keyframes sp-shine {
        0% { filter: drop-shadow(0 0 0 rgba(255, 236, 200, 0)); }
        45% { filter: drop-shadow(0 0 7px rgba(255, 236, 200, 0.95)) brightness(1.35); }
        100% { filter: drop-shadow(0 0 3px rgba(226, 201, 152, 0.45)); }
      }
      /* no fim, a logo brilha cada vez mais até a luz tomar a tela */
      @keyframes sp-bright {
        0% { filter: drop-shadow(0 0 3px rgba(226, 201, 152, 0.45)); }
        100% { filter: drop-shadow(0 0 22px rgba(255, 244, 222, 1)) brightness(2.2); }
      }
      /* luz final: brilho difuso, sem borda, que começa suave e vai aumentando */
      #splash .flash {
        position: absolute; left: 50%; top: 50%; width: 200px; height: 200px; margin: -100px 0 0 -100px; border-radius: 50%;
        translate: 0 -42px; pointer-events: none; opacity: 0; transform: scale(0.35); will-change: transform, opacity;
        background: radial-gradient(circle closest-side,
          rgba(255, 250, 238, 0.9) 0%, rgba(255, 246, 228, 0.72) 12%, rgba(250, 238, 212, 0.5) 26%,
          rgba(244, 228, 196, 0.32) 40%, rgba(236, 216, 176, 0.18) 55%, rgba(226, 201, 152, 0.08) 72%,
          rgba(226, 201, 152, 0.02) 88%, rgba(226, 201, 152, 0) 100%);
      }
      #splash.is-hit .flash { animation: sp-flash 1.15s cubic-bezier(0.5, 0, 0.85, 0.35) 0.03s forwards; }
      @keyframes sp-flash { 0% { opacity: 0; transform: scale(0.35); } 25% { opacity: 0.85; } 100% { opacity: 1; transform: scale(9); } }
      /* véu claro na tela toda, entrando aos poucos junto com a luz */
      #splash .veil {
        position: absolute; inset: 0; pointer-events: none; opacity: 0; will-change: opacity;
        background: radial-gradient(circle at 50% 44%, #fffaf0 0%, #f7efdd 60%, #efe3c8 100%);
      }
      #splash.is-hit .veil { animation: sp-veil 1.0s cubic-bezier(0.5, 0, 0.85, 0.4) 0.23s forwards; }
      @keyframes sp-veil { to { opacity: 1; } }
      /* brilho de diamante na ponta do símbolo */
      #splash .mark svg.spark { position: absolute; width: 16px; height: 16px; left: calc(50.3% - 8px); top: -6px; filter: drop-shadow(0 0 6px rgba(255, 236, 200, 0.9)); opacity: 0; transform: scale(0) rotate(-45deg); animation: sp-spark 0.9s ease-out 1.5s forwards; }
      #splash .mark svg.spark.s2 { width: 11px; height: 11px; left: calc(98% - 5.5px); top: calc(98% - 5.5px); animation-delay: 1.85s; }
      #splash .word { display: flex; flex-direction: column; align-items: center; gap: 8px; }
      #splash .name { font-family: Cinzel, Georgia, serif; font-size: 26px; letter-spacing: 0.32em; margin-right: -0.32em; color: #c9a869; display: flex; }
      #splash .name span { opacity: 0; transform: translateY(6px); animation: sp-letter 0.5s ease-out forwards; }
      #splash .tag { font-family: Cinzel, Georgia, serif; font-size: 9px; letter-spacing: 0.55em; margin-right: -0.55em; color: #e2c998; opacity: 0; animation: sp-fade 0.6s ease-out 2.15s forwards; }
      @keyframes sp-draw { to { stroke-dashoffset: 0; } }
      @keyframes sp-glow { 0% { opacity: 0; transform: scale(0.7); } 60% { opacity: 1; } 100% { opacity: 0.75; transform: scale(1); } }
            @keyframes sp-spark { 0% { opacity: 0; transform: scale(0) rotate(-45deg); } 45% { opacity: 1; transform: scale(1.15) rotate(0deg); } 100% { opacity: 0; transform: scale(0.6) rotate(30deg); } }
      @keyframes sp-letter { to { opacity: 1; transform: none; } }
      @keyframes sp-fade { to { opacity: 1; } }
      #splash.is-quick *, #splash.is-quick *::after { animation-duration: 0.01s !important; animation-delay: 0s !important; }
      #splash.is-quick .spark, #splash.is-quick .flash, #splash.is-quick .veil { display: none; }
      @media (prefers-reduced-motion: reduce) {
        #splash *, #splash *::after { animation-duration: 0.01s !important; animation-delay: 0s !important; }
        #splash .spark, #splash .flash, #splash .veil { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <canvas class="sky"></canvas>
      <div class="glow"></div>
      <div class="flash"></div>
      <div class="veil"></div>
      <div class="mark">
        <svg class="logo" viewBox="0 0 100 100">
          <defs>
            <linearGradient id="sp-gold" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#f3e3be" />
              <stop offset="0.5" stop-color="#c9a869" />
              <stop offset="1" stop-color="#a8864a" />
            </linearGradient>
          </defs>
          <path class="line l1" pathLength="1" d="M50.3 2 L3.2 96.8 L58 96.8" />
          <path class="line l2" pathLength="1" d="M25.1 85.2 L56.1 22.6 L98 98" />
        </svg>
        <svg class="spark" viewBox="0 0 24 24"><path d="M12 0 Q13 11 24 12 Q13 13 12 24 Q11 13 0 12 Q11 11 12 0 Z" fill="#fff6e2" /></svg>
        <svg class="spark s2" viewBox="0 0 24 24"><path d="M12 0 Q13 11 24 12 Q13 13 12 24 Q11 13 0 12 Q11 11 12 0 Z" fill="#fff6e2" /></svg>
      </div>
      <div class="word">
        <div class="name">
          <span style="animation-delay: 1.45s">L</span><span style="animation-delay: 1.54s">I</span><span style="animation-delay: 1.63s">Z</span><span style="animation-delay: 1.72s">A</span><span style="animation-delay: 1.81s">N</span><span style="animation-delay: 1.9s">O</span>
        </div>
        <div class="tag">SEMIJOIAS</div>
      </div>
    </div>
    <script>
      // Abertura completa na 1ª vez da sessão; se reabrir logo em seguida, abreviada.
      (function () {
        var quick = false;
        try { quick = sessionStorage.getItem('lz-splash') === '1'; sessionStorage.setItem('lz-splash', '1'); } catch (e) {}
        var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
        window.__splashMin = Date.now() + (quick || reduce ? 350 : 3800);
        var splash = document.getElementById('splash');
        if (quick) splash.classList.add('is-quick');
        if (!quick && !reduce) sky(splash);
        try {
          var th = localStorage.getItem('lz-theme') || 'dark';
          if (th === 'light' || (th === 'auto' && matchMedia('(prefers-color-scheme: light)').matches)) document.documentElement.dataset.theme = 'light';
        } catch (e) {}
      })();

      // Céu da abertura: partículas douradas e uma estrela cadente que vai até a logo.
      // Quando ela encontra a logo, a luz se acende e o app aparece.
      function sky(splash) {
        var c = splash.querySelector('.sky'), ctx = c.getContext('2d');
        var dpr = Math.min(window.devicePixelRatio || 1, 2), w = innerWidth, h = innerHeight;
        c.width = w * dpr; c.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        var R = function (a, b) { return a + Math.random() * (b - a); };
        var parts = [], n = Math.round(Math.min(80, Math.max(36, (w * h) / 9000)));
        for (var i = 0; i < n; i++) {
          var ang = R(0, 6.283), sp = R(4, 14);
          parts.push({ x: R(0, w), y: R(0, h), r: Math.random() < 0.15 ? R(1.3, 2) : R(0.5, 1.2), vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 3, a: R(0.15, 0.55), tw: R(0.6, 1.6), ph: R(0, 6.283) });
        }
        var t0 = performance.now(), last = t0, star = null, hit = false, burst = null;
        var LAUNCH = 1150, DUR = 1150; // chega na logo por volta de 2,3 s
        function onHit() {
          if (hit) return; hit = true;
          splash.classList.add('is-hit');
          window.__splashMin = Math.max(window.__splashMin - 400, Date.now() + 1250);
        }
        setTimeout(onHit, 2900); // garantia, se o celular estiver lento
        function launch(now) {
          var m = splash.querySelector('.mark').getBoundingClientRect();
          var tx = m.left + m.width * 0.5, ty = m.top + m.height * 0.42;
          var dir = Math.random() < 0.5 ? 1 : -1;
          var x0 = tx + dir * Math.min(w * 0.75, 340), y0 = Math.max(-20, ty - Math.min(h * 0.42, 330));
          star = { x0: x0, y0: y0, dx: tx - x0, dy: ty - y0, t: now };
        }
        function frame(now) {
          if (!c.isConnected) return;
          requestAnimationFrame(frame);
          var dt = Math.min(0.05, (now - last) / 1000); last = now;
          var el = now - t0;
          ctx.clearRect(0, 0, w, h);
          for (var i = 0; i < parts.length; i++) {
            var p = parts[i];
            p.x += p.vx * dt; p.y += p.vy * dt;
            if (p.x < -10) p.x = w + 10; if (p.x > w + 10) p.x = -10; if (p.y < -10) p.y = h + 10; if (p.y > h + 10) p.y = -10;
            var al = p.a * (0.55 + 0.45 * Math.sin(now / 1000 * p.tw + p.ph));
            if (p.r > 1.25) {
              var g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 4);
              g.addColorStop(0, 'rgba(255,240,210,' + al * 0.5 + ')'); g.addColorStop(1, 'rgba(255,240,210,0)');
              ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 4, 0, 6.283); ctx.fill();
            }
            ctx.fillStyle = 'rgba(226,201,152,' + al + ')'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
          }
          if (!star && !hit && el >= LAUNCH) launch(now);
          if (star) {
            var k = Math.min(1, (now - star.t) / DUR);
            var e = 1 - Math.pow(1 - k, 1.7);
            var hx = star.x0 + star.dx * e, hy = star.y0 + star.dy * e;
            var len = Math.sqrt(star.dx * star.dx + star.dy * star.dy), ux = star.dx / len, uy = star.dy / len;
            var tail = 170 * Math.min(1, k * 3) * (k > 0.85 ? (1 - k) / 0.15 * 0.7 + 0.3 : 1);
            var fade = Math.min(1, k / 0.1);
            var gx = ctx.createLinearGradient(hx, hy, hx - ux * tail, hy - uy * tail);
            gx.addColorStop(0, 'rgba(255,250,236,' + 0.95 * fade + ')'); gx.addColorStop(0.3, 'rgba(236,214,170,' + 0.6 * fade + ')'); gx.addColorStop(1, 'rgba(226,201,152,0)');
            ctx.strokeStyle = gx; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
            ctx.beginPath(); ctx.moveTo(hx, hy); ctx.lineTo(hx - ux * tail, hy - uy * tail); ctx.stroke();
            var hr = 9 + 6 * k;
            var hg = ctx.createRadialGradient(hx, hy, 0, hx, hy, hr);
            hg.addColorStop(0, 'rgba(255,248,232,' + fade + ')'); hg.addColorStop(1, 'rgba(255,248,232,0)');
            ctx.fillStyle = hg; ctx.beginPath(); ctx.arc(hx, hy, hr, 0, 6.283); ctx.fill();
            if (k >= 1) { burst = { x: hx, y: hy, t: now }; star = null; onHit(); }
          }
          if (burst) { // clarão no instante em que a estrela toca a logo
            var b = Math.min(1, (now - burst.t) / 650), br = 14 + 150 * (1 - Math.pow(1 - b, 3));
            var bg = ctx.createRadialGradient(burst.x, burst.y, 0, burst.x, burst.y, br);
            bg.addColorStop(0, 'rgba(255,250,236,' + 0.9 * (1 - b) + ')'); bg.addColorStop(0.35, 'rgba(240,220,180,' + 0.45 * (1 - b) + ')'); bg.addColorStop(1, 'rgba(226,201,152,0)');
            ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(burst.x, burst.y, br, 0, 6.283); ctx.fill();
            if (b >= 1) burst = null;
          }
        }
        requestAnimationFrame(function () { c.classList.add('is-on'); requestAnimationFrame(frame); });
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
